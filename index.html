<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#e63946">
<title>Italiano Vokabeltrainer</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1a1a2e; color: #eee; overscroll-behavior: none; }
body { display: flex; flex-direction: column; max-width: 600px; margin: 0 auto; min-height: 100vh; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0; }
header { padding: 1rem; background: #16213e; border-bottom: 1px solid #0f3460; text-align: center; }
header h1 { font-size: 1.2rem; color: #e63946; }
nav { display: flex; background: #16213e; border-bottom: 1px solid #0f3460; }
nav button { flex: 1; padding: 0.8rem; background: none; border: none; color: #aaa; font-size: 0.9rem; cursor: pointer; border-bottom: 3px solid transparent; }
nav button.active { color: #e63946; border-bottom-color: #e63946; }
main { flex: 1; padding: 1rem; overflow-y: auto; }
.view { display: none; }
.view.active { display: block; }
.card { background: #16213e; border: 1px solid #0f3460; border-radius: 12px; padding: 2rem 1.5rem; margin-bottom: 1rem; text-align: center; }
.card .prompt-label { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem; }
.card .prompt-word { font-size: 1.8rem; font-weight: 600; margin-bottom: 1.5rem; color: #fff; min-height: 2.5rem; }
.card input[type="text"] { width: 100%; padding: 0.9rem; font-size: 1.1rem; background: #0f3460; border: 2px solid #0f3460; color: #fff; border-radius: 8px; text-align: center; }
.card input[type="text"]:focus { outline: none; border-color: #e63946; }
.card .feedback { margin-top: 1rem; padding: 0.8rem; border-radius: 8px; font-size: 1rem; min-height: 1.2rem; }
.card .feedback.correct { background: #2d6a4f; color: #d8f3dc; }
.card .feedback.wrong { background: #6a040f; color: #ffccd5; }
.card .feedback.empty { background: transparent; color: transparent; }
.card .correct-answer { display: block; margin-top: 0.5rem; font-weight: 600; font-size: 1.1rem; }
.btn { display: block; width: 100%; padding: 0.9rem; margin-top: 0.5rem; font-size: 1rem; font-weight: 600; background: #e63946; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
.btn:active { transform: scale(0.98); }
.btn-secondary { background: #0f3460; color: #eee; }
.btn-tertiary { background: transparent; color: #aaa; border: 1px solid #0f3460; }
.btn-row { display: flex; gap: 0.5rem; }
.btn-row .btn { flex: 1; }
.btn-self-rate { background: #0f3460; color: #fff; }
.btn-self-rate.knew { background: #2d6a4f; }
.btn-self-rate.almost { background: #b08968; }
.btn-self-rate.didnt { background: #6a040f; }
.stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; margin-bottom: 1rem; }
.stat-box { background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 0.8rem 0.3rem; text-align: center; }
.stat-box .num { font-size: 1.5rem; font-weight: 700; color: #e63946; }
.stat-box .label { font-size: 0.7rem; color: #888; margin-top: 0.2rem; }
.stat-box.due .num { color: #ffd60a; }
.mode-toggle { display: flex; background: #16213e; border: 1px solid #0f3460; border-radius: 8px; margin-bottom: 1rem; padding: 4px; }
.mode-toggle button { flex: 1; padding: 0.6rem; background: none; border: none; color: #aaa; font-size: 0.85rem; cursor: pointer; border-radius: 6px; }
.mode-toggle button.active { background: #e63946; color: #fff; }
.empty-state { text-align: center; padding: 3rem 1rem; color: #888; }
.empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }
.vocab-list { list-style: none; }
.vocab-item { background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 0.8rem 1rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
.vocab-item .words { flex: 1; min-width: 0; }
.vocab-item .de { font-weight: 600; color: #fff; }
.vocab-item .it { color: #aaa; font-size: 0.9rem; margin-top: 0.2rem; }
.vocab-item .box-badge { background: #0f3460; color: #e63946; padding: 0.2rem 0.5rem; border-radius: 12px; font-size: 0.75rem; font-weight: 700; min-width: 24px; text-align: center; }
.vocab-item .delete-btn { background: none; border: none; color: #6a040f; font-size: 1.3rem; cursor: pointer; padding: 0 0.3rem; }
.form-group { margin-bottom: 1rem; }
.form-group label { display: block; font-size: 0.85rem; color: #888; margin-bottom: 0.4rem; }
.form-group input { width: 100%; padding: 0.7rem; font-size: 1rem; background: #16213e; border: 1px solid #0f3460; color: #fff; border-radius: 6px; }
.form-group input:focus { outline: none; border-color: #e63946; }
.search-box { width: 100%; padding: 0.7rem; font-size: 1rem; background: #16213e; border: 1px solid #0f3460; color: #fff; border-radius: 6px; margin-bottom: 1rem; }
.toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #e63946; color: #fff; padding: 0.7rem 1.5rem; border-radius: 24px; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100; }
.toast.show { opacity: 1; }
.section-title { font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 0.1em; margin: 1.5rem 0 0.5rem 0; }
.section-title:first-child { margin-top: 0; }
details { background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 0.8rem 1rem; margin-bottom: 0.5rem; }
details summary { cursor: pointer; font-size: 0.9rem; color: #aaa; }
details[open] summary { margin-bottom: 0.8rem; color: #e63946; }
details p { font-size: 0.85rem; color: #ccc; line-height: 1.5; margin-bottom: 0.5rem; }
</style>
</head>
<body>
<header><h1>🇮🇹 Italiano Vokabeltrainer</h1></header>
<nav>
  <button data-view="train" class="active">Üben</button>
  <button data-view="list">Vokabeln</button>
  <button data-view="add">+ Neu</button>
  <button data-view="settings">⚙️</button>
</nav>
<main>
  <section id="view-train" class="view active"></section>
  <section id="view-list" class="view"></section>
  <section id="view-add" class="view"></section>
  <section id="view-settings" class="view"></section>
</main>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
